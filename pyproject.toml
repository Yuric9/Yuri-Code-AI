[project]
name = "yuri-code-ai"
version = "0.1.0"
description = "AI coding agent built with OpenHands Software Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openhands-sdk",
]

[project.scripts]
yuri-code-ai = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
