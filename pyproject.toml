[project]
name = "yuri-code-ai"
version = "0.2.0"
description = "AI coding agent with autonomous web research and persistent memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openhands-sdk",
    "sqlalchemy>=2.0",
    "tavily-python>=0.7",
]

[project.scripts]
yuri-code-ai = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
