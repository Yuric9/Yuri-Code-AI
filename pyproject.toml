[project]
name = "yuri-code-ai"
version = "0.4.0"
description = "Autonomous AI software engineering agent with web research and persistent task orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openhands-sdk",
    "sqlalchemy>=2.0",
    "tavily-python>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yuri-code-ai = "agent.main:main"
yuri-code-ai-api = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "server"]
